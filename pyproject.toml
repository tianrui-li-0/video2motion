[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video2motion"
version = "0.1.0"
description = "Auditable video-to-articulated-motion extraction with pluggable adapters"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
download = ["huggingface_hub>=0.28"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["video2motion"]
